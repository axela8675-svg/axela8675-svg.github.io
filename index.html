<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sala de Hospital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #1a365d;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #4a5568;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .pacientes-container {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
        }
        .paciente-tarjeta {
            background-color: #e2e8f0;
            padding: 10px;
            border-left: 5px solid #3182ce;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>
<body>

    <div class="form-container">
        <h2>Registro de Sala</h2>
        <form id="formularioHospital">
            <div class="form-group">
                <label for="nombrePaciente">Nombre Completo:</label>
                <input type="text" id="nombrePaciente" placeholder="Ej. Juan Pérez" required>
            </div>
            
            <div class="form-group">
                <label for="salaHospital">Sala Asignada:</label>
                <select id="salaHospital">
                    <option value="Urgencias">Urgencias</option>
                    <option value="Pediatría">Pediatría</option>
                    <option value="Cuidados Intensivos">Cuidados Intensivos</option>
                    <option value="Maternidad">Maternidad</option>
                </select>
            </div>

            <button type="submit">Registrar Paciente</button>
        </form>
    </div>

    <div class="pacientes-container">
        <h3>Pacientes en Sala</h3>
        <div id="listaPacientes">
            <!-- Los pacientes registrados aparecerán aquí -->
        </div>
    </div>

    <script>
        // Selección de elementos del DOM
        const formulario = document.getElementById('formularioHospital');
        const nombreInput = document.getElementById('nombrePaciente');
        const salaSelect = document.getElementById('salaHospital');
        const listaPacientes = document.getElementById('listaPacientes');

        // Escuchar el evento de envío (submit) del formulario
        formulario.addEventListener('submit', function(event) {
            // Evitar que la página se recargue
            event.preventDefault();

            // Obtener y limpiar los valores de los campos
            const nombre = nombreInput.value.trim();
            const sala = salaSelect.value;

            // Validación básica en JS
            if (nombre === "") {
                alert("Por favor, ingrese un nombre válido.");
                return;
            }

            // Crear el elemento visual para el nuevo paciente
            const tarjeta = document.createElement('div');
            tarjeta.classList.add('paciente-tarjeta');
            tarjeta.innerHTML = `<strong>Paciente:</strong> ${nombre} <br> <strong>Sala:</strong> ${sala}`;

            // Agregar el paciente a la lista en pantalla
            listaPacientes.appendChild(tarjeta);

            // Limpiar el campo del nombre para un nuevo registro
            formulario.reset();
        });
    </script>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
